[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfyui-remote-gateway"
version = "0.1.0"
description = "Fail-closed remote routing policy for team-owned ComfyUI gateways."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mihailorama" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/mihailorama/comfyui-remote-gateway"
Repository = "https://github.com/mihailorama/comfyui-remote-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_remote_gateway"]
